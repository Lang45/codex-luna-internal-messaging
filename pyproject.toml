[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-luna-internal-messaging"
version = "0.1.0"
description = "Safely inspect and enable the Codex model-catalog gate required for Luna subagent internal messaging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lang45" }]
keywords = ["codex", "subagents", "gpt-5.6-luna", "multi-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/Lang45/codex-luna-internal-messaging"
Issues = "https://github.com/Lang45/codex-luna-internal-messaging/issues"

[project.scripts]
codex-luna-internal-messaging = "codex_luna_internal_messaging.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
